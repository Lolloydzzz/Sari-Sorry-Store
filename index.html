<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143f45">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Sari-Sari Store Tycoon (Beta)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="hud">
      <div class="stat" id="who">-</div>
      <div class="stat" id="moneyStat"></div>
      <div class="stat" id="timeStat"></div>
      <div class="stat" id="lives"></div>
    </header>

    <div class="controls">
      <button id="openBtn">Open Store</button>
      <button id="closeBtn" hidden>Close Store</button>
      <button class="ghost" id="marketBtn">Palengke</button>
      <button class="ghost" id="profileBtn">Profile</button>
    </div>

    <section class="store closed" id="store">
      <div class="roof"></div>
      <div class="sign"><b id="signName">Tindahan</b><small>SARI-SARI STORE</small></div>

      <div class="wall">
        <div class="sachets" id="sachets" aria-hidden="true"></div>
        <div class="decorWall" id="decorWall" aria-hidden="true"></div>
        <div class="oc" aria-hidden="true"><i></i><i></i><b id="ocText">SARADO</b></div>

        <div class="window">
          <div class="scene" aria-hidden="true">
        <div class="stars"></div>
        <div class="sun" id="sun"></div><div class="moon" id="moon"></div>
        <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
        <svg class="skyline" viewBox="0 0 580 70" preserveAspectRatio="xMidYMax slice">
          <path class="sil2" d="M0 70V50h36V42l12-8 12 8v8h40V46h30V38l14-9 14 9v12h44V48h34V40l16-10 16 10v10h50V46h30V36l14-8 14 8v14h46V48h40V42l12-8 12 8v8h60v20z"/>
          <path class="line" d="M0 28Q150 42 300 22Q450 42 580 28"/>
          <path class="line thick" d="M300 70V16M287 23h26M291 30h18"/>
          <g class="tree"><path d="M62 70q-4-22 4-42"/><path d="M66 28q-14-4-22 6M66 28q-10-12-24-8M66 28q4-14 18-14M66 28q14-6 24 4M66 28q10 4 14 14"/></g>
          <g class="tree"><path d="M508 70q4-20-2-38"/><path d="M506 32q-14-2-22 8M506 32q-8-12-22-8M506 32q2-14 16-16M506 32q14-4 24 6M506 32q10 6 12 16"/></g>
          <path class="sil" d="M128 70V48h44v22zM124 50l26-16 26 16z"/>
          <rect class="win" x="136" y="54" width="9" height="9"/><rect class="win" x="154" y="54" width="9" height="9"/>
          <path class="sil" d="M372 70V50h50v20zM368 52l29-17 29 17z"/>
          <rect class="win" x="380" y="56" width="9" height="9"/><rect class="win" x="404" y="56" width="9" height="9"/>
          <rect class="ground" y="64" width="580" height="8"/>
        </svg>
      </div>
          <div class="customer" id="customer"></div>
          <div class="bubble" id="bubble">Sarado pa ang store.</div>
          <div class="patience"><div id="patienceBar"></div></div>
          <div class="shutter"></div>
        </div>

        <div class="hanging" id="hanging"></div>
        <div class="shelf" id="shelf"></div>
        <div class="ledge" id="ledge"></div>

        <div class="dock">
          <p class="msg" id="msg" aria-live="polite"></p>

          <div class="counter" id="counter">
            <div class="tray" id="tray"></div>
            <div class="buttons">
              <button id="giveBtn">Ibigay</button>
              <button id="clearBtn" class="ghost">Linisin</button>
            </div>
            <div class="qrWrap"><div class="qr" id="qr"></div><small>QR ng store</small></div>
          </div>

          <!-- Pa-load -->
          <div class="loadForm" id="loadForm" hidden>
            <div class="ldRow">
              <label>Number (5 digits)
                <input id="ldNum" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" placeholder="_ _ _ _ _">
              </label>
              <label>Ilo-load (₱)
                <input id="ldAmt" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="hal. 30">
              </label>
            </div>
            <button id="ldSend">I-send ang Load</button>
          </div>

          <!-- Sukli -->
          <div class="change" id="change" hidden>
            <div class="chInfo"><span id="chInfo"></span><b id="chSum">Sukli mo: ₱0</b></div>
            <div class="bills" id="bills"></div>
            <div class="chips" id="chList"></div>
            <div class="buttons">
              <button id="chGive">Ibigay ang Sukli</button>
              <button id="chReset" class="ghost">Ulitin</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="overlay hidden" id="overlay">

      <!-- Profile setup -->
      <section class="card panel" id="p-setup">
        <span class="beta">BETA</span>
        <h1>Gumawa ng Profile</h1>
        <label>Name mo
          <input id="inName" maxlength="14" placeholder="hal. Ana" autocomplete="off">
        </label>
        <label>Pangalan ng store mo
          <input id="inStore" maxlength="22" placeholder="hal. Tindahan ni Aling Nena" autocomplete="off">
        </label>
        <fieldset><legend>Avatar</legend><div class="choices" id="avatars"></div></fieldset>
        <fieldset><legend>Bakit ka nagtayo ng sari-sari store?</legend><div class="reasons" id="reasons"></div></fieldset>
        <p class="err" id="setupErr"></p>
        <button id="saveBtn">Simulan na ang story</button>
      </section>

      <!-- Story -->
      <section class="card panel" id="p-story">
        <div class="storyIcon" id="storyIcon"></div>
        <p class="storyText" id="storyText"></p>
        <div class="dots" id="dots"></div>
        <button id="nextBtn">Next</button>
      </section>

      <!-- Profile -->
      <section class="card panel" id="p-menu">
        <span class="beta">BETA</span>
        <div class="bigAvatar" id="mAvatar"></div>
        <h1 id="mName">-</h1>
        <p class="sub" id="mStore">-</p>
        <p class="rank" id="mRank">-</p>
        <p class="wallet">Pera mo: <span class="coin">₱</span> <b id="mWallet">0</b></p>
        <div class="stats" id="mStats"></div>
        <div class="row">
          <button class="ghost" id="storyBtn">Basahin ulit ang story</button>
          <button class="ghost" id="editBtn">I-edit ang profile</button>
        </div>
        <button class="ghost" id="achBtn">Achievements</button>
        <button id="closeProfileBtn">Balik sa store</button>
        <button class="link" id="resetBtn">I-reset ang profile</button>
      </section>

      <!-- Achievements -->
      <section class="card panel wide" id="p-ach">
        <h1>Achievements</h1>
        <p class="wallet" id="achCount"></p>
        <div class="achList" id="achList"></div>
        <button class="ghost" id="achBack">Balik sa Profile</button>
      </section>

      <!-- Palengke (shop) -->
      <section class="card panel wide" id="p-shop">
        <h1>Palengke</h1>
        <p class="wallet">Pera mo: <span class="coin">₱</span> <b id="wallet">0</b></p>
        <div class="tabs">
          <button data-tab="stock">Stock</button>
          <button data-tab="up">Upgrade</button>
          <button data-tab="prod">Bagong Paninda</button>
          <button data-tab="dec">Decor</button>
        </div>
        <div class="shopList" id="shopList"></div>
        <button class="ghost" id="shopBack">Balik sa store</button>
      </section>

      <!-- Tapos na ang shift -->
      <section class="card panel" id="p-over">
        <h1 id="oTitle">Tapos na!</h1>
        <p id="oText"></p>
        <button id="againBtn">Open ulit</button>
        <button class="ghost" id="shopBtn2">Pumunta sa Palengke</button>
        <button class="ghost" id="backStoreBtn">Balik sa store</button>
      </section>

    </div>
  </main>
  <div class="toast" id="toast" hidden></div>
  <script src="art.js"></script>
  <script src="script.js"></script>
</body>
</html>
